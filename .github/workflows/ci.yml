name: CI

# Runs the pytest suite on every push and pull request. This branch's
# modernization effort (see AGENTS.md, docs/modernization.md) targets Python
# 3.14 exclusively, so a single interpreter version is enough here -- there is
# no compatibility matrix to protect.
#
# PiCN/Simulations is intentionally excluded: those tests start real
# multi-node scenarios and are slow enough to eat a free-tier CI budget for
# little regression-detection value. They stay a local/manual concern for now
# (see docs/baseline.md).

on:
  push:
    branches: [modernization/asyncio-python314]
  pull_request:
    branches: [modernization/asyncio-python314]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        # Deliberately not `pip install -e .` or `requirements.txt`: the
        # package doesn't need to be installed to run its own test suite
        # (pytest picks it up via rootdir), and requirements.txt pins an
        # obsolete opencv-python build that doesn't build on current Python
        # and is only needed for unrelated demos (see AGENTS.md). The same
        # packages are declared as the "dev" extra in pyproject.toml for
        # local contributors who do want `pip install -e .[dev]`.
        run: python -m pip install --upgrade pip && pip install pytest pytest-timeout pytest-rerunfailures pytest-asyncio numpy

      - name: Run test suite
        run: >
          python -m pytest PiCN/
          --ignore=PiCN/Simulations
          -v
          --timeout=90
          -p no:cacheprovider
          --reruns 2
          --reruns-delay 1
