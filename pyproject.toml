[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PiCN"
version = "0.1.0"
description = "A modular Python ICN implementation"
readme = "README.md"
license = {text = "BSD-3-Clause"}
# The modernization effort targets Python 3.14 exclusively
requires-python = ">=3.14"
authors = [
    {name = "Christopher Scherb", email = "christopher.scherb@unibas.ch"},
    {name = "Dennis Grewe", email = "dennis.grewe@hs-esslingen.de"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Network Application :: ICN :: NFN",
]

[project.optional-dependencies]
opencv = ["opencv-python>=4.2"]
dev = [
    "pytest",
    "pytest-timeout",
    "pytest-rerunfailures",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "hypothesis",
    "cryptography",
]
# Needed only when using picn-relay -c/--config (TOML config files)
config = ["pytoml"]
# Agentic binding extras — LLM clients stay out of the forwarding path (AC3).
agentic = ["pydantic-ai", "cryptography"]

[project.scripts]
# No console scripts — entry points live in starter/ and ProgramLibs/

[tool.setuptools.packages.find]
where = ["."]
include = ["PiCN*", "PiCNExternal*", "agentic*"]

[tool.pytest.ini_options]
# Architectural tests under agentic/tests run first when selecting agentic/.
testpaths = ["agentic", "PiCN", "PiCNExternal"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-q"
# ADR-010: strict mode requires every async test to be explicitly marked with
# @pytest.mark.asyncio (no silent auto-detection of coroutine tests), and
# function-scoped loops give each test a fresh event loop -- no state leaks
# between tests, no order-dependent failures.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

# mypy --strict on agentic/ only. Inherited PiCN.* is excluded: it is not
# typed end-to-end, and the port/adapter split exists so agentic code does not
# need those annotations to stay sound.
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "."
files = ["agentic"]
exclude = [
    "(^|/)PiCN(/|$)",
    "(^|/)PiCNExternal(/|$)",
    "(^|/)agentic/tests(/|$)",
]

[[tool.mypy.overrides]]
module = ["PiCN.*", "PiCNExternal.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["cryptography.*"]
ignore_missing_imports = true

# AsyncLayerProcess is untyped upstream; allow subclassing without weakening
# strict checks on our own code.
[[tool.mypy.overrides]]
module = ["agentic.agentic_layer.layer"]
disallow_subclassing_any = false

# Coverage is measured on agentic production modules and gated at 90%.
[tool.coverage.run]
branch = true
source = ["agentic"]
omit = [
    "agentic/tests/*",
    "agentic/port/protocol.py",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
