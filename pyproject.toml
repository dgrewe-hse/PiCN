[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PiCN"
version = "0.1.0"
description = "A modular Python ICN implementation"
readme = "README.md"
license = {text = "BSD-3-Clause"}
# The modernization effort on this branch targets Python 3.14 exclusively
# (see AGENTS.md / docs/modernization.md). Earlier classifiers below record
# what upstream historically supported before this branch's floor was raised.
requires-python = ">=3.14"
authors = [
    {name = "Christopher Scherb", email = "christopher.scherb@unibas.ch"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Network Application :: ICN :: NFN",
]

[project.optional-dependencies]
opencv = ["opencv-python>=4.2"]
dev = ["pytest", "pytest-timeout", "pytest-rerunfailures"]

[project.scripts]
# No console scripts — entry points live in starter/ and ProgramLibs/

[tool.setuptools.packages.find]
where = ["."]
include = ["PiCN*", "PiCNExternal*"]

[tool.pytest.ini_options]
testpaths = ["PiCN", "PiCNExternal"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-q"
