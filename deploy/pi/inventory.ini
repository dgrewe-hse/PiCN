# Experiment E — 2-edge physical inventory (design v4 §5.6).
#
# Placeholder IPs (RFC 1918 lab range) — replace with the real bench
# addresses; no credentials belong in this file. Every node runs
# `python -m demo.physical_node` under systemd with the env contract from
# demo/physical_node.py (PICN_ROLE … PICN_EDGES).
#
# Serving model (matching the code): every node with role in
# {edge, producer, llm} serves its PICN_OWNED_PREFIXES on an
# AgenticForwarder (registered producers). The intake's per-cell edge
# endpoints select which serving hosts a campaign targets; edges and their
# producers carry the same prefix slice for the co-located and split
# deployment variants of the same cell.

[intake]
pi-01 ansible_host=10.0.0.11 role=intake picn_listen_port=9100

[edges]
pi-02 ansible_host=10.0.0.12 role=edge edge_id=edge1 picn_listen_port=9001 owned_prefixes=/cap/fwd/hospital/beds/h1,/cap/fwd/hospital/beds/h2,/cap/fwd/hospital/beds/h3,/cap/fwd/hospital/beds/h4
pi-03 ansible_host=10.0.0.13 role=edge edge_id=edge2 picn_listen_port=9002 owned_prefixes=/cap/fwd/hospital/beds/h5,/cap/fwd/hospital/beds/h6,/cap/fwd/hospital/beds/h7,/cap/fwd/hospital/beds/h8

[producers]
pi-04 ansible_host=10.0.0.14 role=producer edge_id=edge1 picn_listen_port=9101 owned_prefixes=/cap/fwd/hospital/beds/h1,/cap/fwd/hospital/beds/h2,/cap/fwd/hospital/beds/h3,/cap/fwd/hospital/beds/h4
pi-05 ansible_host=10.0.0.15 role=producer edge_id=edge2 picn_listen_port=9102 owned_prefixes=/cap/fwd/hospital/beds/h5,/cap/fwd/hospital/beds/h6,/cap/fwd/hospital/beds/h7,/cap/fwd/hospital/beds/h8
pi-08 ansible_host=10.0.0.18 role=producer edge_id=edge2 picn_listen_port=9104 owned_prefixes=/cap/fwd/hospital/beds/h5,/cap/fwd/hospital/beds/h6,/cap/fwd/hospital/beds/h7,/cap/fwd/hospital/beds/h8

[llm]
pi-06 ansible_host=10.0.0.16 role=llm edge_id=edge1 picn_listen_port=9103 llm_placement=on-pi owned_prefixes=/cap/fwd/hospital/beds/h1,/cap/fwd/hospital/beds/h2,/cap/fwd/hospital/beds/h3,/cap/fwd/hospital/beds/h4,/cap/fwd/hospital/beds/h5,/cap/fwd/hospital/beds/h6,/cap/fwd/hospital/beds/h7,/cap/fwd/hospital/beds/h8

[observer]
pi-07 ansible_host=10.0.0.17 role=observer

[picn:children]
intake
edges
producers
llm
observer

[all:vars]
# Deployment truth (attested in every node's run marker at run time).
picn_commit=SET_AT_BRINGUP
python_version=3.14
edges=2
min_physical_runs=30
min_llm_runs=15
