# pi-04 — producer for edge1: dedicated deterministic serving host. Same
# prefix slice as its edge (split-deployment variant of the h1-h4 cell: point
# the intake cell at 10.0.0.14:9101 instead of edge1:9001).
picn_role: "producer"
edge_id: "edge1"
picn_listen_port: 9101
picn_owned_prefixes:
  - /cap/fwd/hospital/beds/h1
  - /cap/fwd/hospital/beds/h2
  - /cap/fwd/hospital/beds/h3
  - /cap/fwd/hospital/beds/h4
picn_backend: "deterministic"
picn_llm_placement: ""
picn_model_config: ""

# Upstream peer = intake (edge1 in a two-hop wiring).
picn_peer_host: "10.0.0.11"
picn_peer_port: 9100
